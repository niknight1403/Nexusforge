name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android-apk.yaml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and lint debug APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace assembleDebug lintDebug
      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-app/app/build/outputs/apk/debug/app-debug.apk | tee android-app/app/build/outputs/apk/debug/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NexusForge-v0.4.0-debug-apk
          path: android-app/app/build/outputs/apk/debug/
          if-no-files-found: error

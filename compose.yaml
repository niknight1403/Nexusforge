services:
  nexusforge:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      NEXUSFORGE_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
